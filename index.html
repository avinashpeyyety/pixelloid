<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Two-person dialogue — HTML &amp; CSS</title>
  <style>
    :root {
      --bg: #1a1d2e;
      --floor: #252a3d;
      --a: #6eb5ff;
      --a-glow: rgba(110, 181, 255, 0.4);
      --b: #ffb86c;
      --b-glow: rgba(255, 184, 108, 0.4);
      --bubble: #f4f1ea;
      --ink: #2a2630;
      --muted: #8b90a8;
      --cycle: 18s;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: radial-gradient(ellipse 100% 70% at 50% 0%, #2d3350, var(--bg) 60%);
      color: #e8e6e3;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }

    .stage {
      width: min(620px, 100%);
      background: var(--floor);
      border-radius: 20px;
      padding: 2rem 1.25rem 1.75rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .cast {
      display: flex;
      justify-content: space-between;
      padding: 0 0.25rem 1.5rem;
    }

    .person {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
    }

    .avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      position: relative;
      animation: bob 2.8s ease-in-out infinite;
    }

    .person-a .avatar {
      background: linear-gradient(145deg, #5a9fd8, #2d5a8a);
      box-shadow: 0 0 0 3px var(--bg), 0 0 20px var(--a-glow);
    }

    .person-b .avatar {
      background: linear-gradient(145deg, #e8a050, #b86a28);
      box-shadow: 0 0 0 3px var(--bg), 0 0 20px var(--b-glow);
      animation-delay: -1.4s;
    }

    .face {
      position: absolute;
      inset: 24% 30%;
    }

    .eyes {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
    }

    .eye {
      width: 7px;
      height: 7px;
      background: var(--bg);
      border-radius: 50%;
    }

    .mouth {
      width: 16px;
      height: 7px;
      margin: 0 auto;
      border: 2px solid var(--bg);
      border-top: none;
      border-radius: 0 0 10px 10px;
    }

    .person-a .mouth { animation: speak-a var(--cycle) linear infinite; }
    .person-b .mouth { animation: speak-b var(--cycle) linear infinite; }

    .name {
      font-size: 0.72rem;
      font-weight: 600;
    }
    .person-a .name { color: var(--a); }
    .person-b .name { color: var(--b); }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes speak-a {
      0%, 4%, 28%, 32%, 56%, 60%, 84%, 88%, 100% {
        height: 7px;
        border-radius: 0 0 10px 10px;
        transform: scaleY(1);
      }
      4.1%, 27.9%, 32.1%, 55.9%, 60.1%, 83.9%, 88.1%, 99.9% {
        height: 9px;
        border-radius: 50%;
        transform: scaleY(1.25);
      }
    }

    @keyframes speak-b {
      0%, 16%, 20%, 44%, 48%, 72%, 76%, 100% {
        height: 7px;
        border-radius: 0 0 10px 10px;
        transform: scaleY(1);
      }
      16.1%, 19.9%, 20.1%, 43.9%, 48.1%, 71.9%, 76.1%, 99.9% {
        height: 9px;
        border-radius: 50%;
        transform: scaleY(1.25);
      }
    }

    .dialogue {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 260px;
    }

    .line {
      display: flex;
      opacity: 0;
      transform: translateY(10px) scale(0.97);
    }

    .line.from-a { justify-content: flex-start; }
    .line.from-b { justify-content: flex-end; }

    .bubble {
      max-width: 80%;
      padding: 0.7rem 0.95rem;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.4;
      color: var(--ink);
      background: var(--bubble);
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.18);
      position: relative;
    }

    .from-a .bubble {
      border-bottom-left-radius: 3px;
      box-shadow: -2px 4px 16px var(--a-glow);
    }

    .from-b .bubble {
      border-bottom-right-radius: 3px;
      box-shadow: 2px 4px 16px var(--b-glow);
    }

    .from-a .bubble::before,
    .from-b .bubble::before {
      content: "";
      position: absolute;
      bottom: 0;
      width: 10px;
      height: 10px;
      background: var(--bubble);
    }

    .from-a .bubble::before {
      left: -5px;
      clip-path: polygon(100% 0, 0 100%, 100% 100%);
    }

    .from-b .bubble::before {
      right: -5px;
      clip-path: polygon(0 0, 0 100%, 100% 100%);
    }

    /* One 18s timeline — each line visible ~14% of cycle */
    .line:nth-child(1) { animation: show-1 var(--cycle) linear infinite; }
    .line:nth-child(2) { animation: show-2 var(--cycle) linear infinite; }
    .line:nth-child(3) { animation: show-3 var(--cycle) linear infinite; }
    .line:nth-child(4) { animation: show-4 var(--cycle) linear infinite; }
    .line:nth-child(5) { animation: show-5 var(--cycle) linear infinite; }
    .line:nth-child(6) { animation: show-6 var(--cycle) linear infinite; }

    @keyframes show-1 {
      0%, 2% { opacity: 0; transform: translateY(10px) scale(0.97); }
      4%, 14% { opacity: 1; transform: translateY(0) scale(1); }
      16%, 100% { opacity: 0; transform: translateY(-6px) scale(0.98); }
    }
    @keyframes show-2 {
      0%, 14% { opacity: 0; transform: translateY(10px) scale(0.97); }
      16%, 30% { opacity: 1; transform: translateY(0) scale(1); }
      32%, 100% { opacity: 0; transform: translateY(-6px) scale(0.98); }
    }
    @keyframes show-3 {
      0%, 30% { opacity: 0; transform: translateY(10px) scale(0.97); }
      32%, 46% { opacity: 1; transform: translateY(0) scale(1); }
      48%, 100% { opacity: 0; transform: translateY(-6px) scale(0.98); }
    }
    @keyframes show-4 {
      0%, 46% { opacity: 0; transform: translateY(10px) scale(0.97); }
      48%, 62% { opacity: 1; transform: translateY(0) scale(1); }
      64%, 100% { opacity: 0; transform: translateY(-6px) scale(0.98); }
    }
    @keyframes show-5 {
      0%, 62% { opacity: 0; transform: translateY(10px) scale(0.97); }
      64%, 78% { opacity: 1; transform: translateY(0) scale(1); }
      80%, 100% { opacity: 0; transform: translateY(-6px) scale(0.98); }
    }
    @keyframes show-6 {
      0%, 78% { opacity: 0; transform: translateY(10px) scale(0.97); }
      80%, 94% { opacity: 1; transform: translateY(0) scale(1); }
      96%, 100% { opacity: 0; transform: translateY(-6px) scale(0.98); }
    }

    .hint {
      margin-top: 1rem;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Dialogue — HTML &amp; CSS only</h1>

  <div class="stage">
    <div class="cast">
      <div class="person person-a">
        <div class="avatar">
          <div class="face">
            <div class="eyes"><span class="eye"></span><span class="eye"></span></div>
            <div class="mouth"></div>
          </div>
        </div>
        <span class="name">Anya</span>
      </div>
      <div class="person person-b">
        <div class="avatar">
          <div class="face">
            <div class="eyes"><span class="eye"></span><span class="eye"></span></div>
            <div class="mouth"></div>
          </div>
        </div>
        <span class="name">Ravi</span>
      </div>
    </div>

    <div class="dialogue">
      <div class="line from-a">
        <div class="bubble">Did you finish the animation sketch?</div>
      </div>
      <div class="line from-b">
        <div class="bubble">Almost — just the timing on the bubbles.</div>
      </div>
      <div class="line from-a">
        <div class="bubble">Pure CSS? No JavaScript?</div>
      </div>
      <div class="line from-b">
        <div class="bubble">Only keyframes and animation-delay.</div>
      </div>
      <div class="line from-a">
        <div class="bubble">Nice. It loops cleanly too.</div>
      </div>
      <div class="line from-b">
        <div class="bubble">Ship it. Coffee after.</div>
      </div>
    </div>
  </div>

  <p class="hint">18s loop · edit the <code>.bubble</code> text and <code>@keyframes show-*</code> to add lines</p>
</body>
</html>
