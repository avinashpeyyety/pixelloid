<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1810" />
  <title>Chocolate Dance School — Pixelloid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="stage" aria-hidden="true"></div>

  <header class="hud-top">
    <div class="logo">
      <span class="logo-emoji" aria-hidden="true">🍫</span>
      <div>
        <h1>Chocolate Dance School</h1>
        <p class="tag">Professor Cocoa’s class · for silly kids (and parents)</p>
      </div>
    </div>
    <div class="badge-live" id="lesson-badge">Lesson 1</div>
  </header>

  <div class="speech" id="speech" role="status" aria-live="polite">
    <span class="who" id="speech-who">Professor Cocoa</span>
    <p id="speech-text">Tap <strong>Start class</strong> — I’m melting to meet you!</p>
  </div>

  <footer class="hud-bottom">
    <div class="controls">
      <button type="button" class="btn primary" id="btn-start">▶ Start class</button>
      <button type="button" class="btn" id="btn-music" aria-pressed="false">🎵 Music off</button>
      <button type="button" class="btn" id="btn-reset">↺ Again!</button>
    </div>
    <p class="hint">Move: drag · Zoom: scroll · Best with music on 💃</p>
  </footer>

  <div class="loader" id="loader">
    <div class="loader-choco"></div>
    <p>Unwrapping chocolates…</p>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
